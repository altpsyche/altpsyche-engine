# Publishing a version of this library.
#
# It lives inside the package rather than beside the site's own workflows on
# purpose. GitHub reads workflows from a repository's root, so this one does
# nothing where it sits today, and when the package moves to its own repository
# this directory becomes that repository's root and the workflow runs unchanged.
#
# Provenance is why this is a workflow rather than a command somebody runs. npm
# records who built a package and from which commit, and it can only do that when
# the build happens here and the job is allowed to ask GitHub for an identity
# token, which is the `id-token: write` permission below.
#
# That same identity token is what authenticates the publish, so there is no npm
# token anywhere in here. npm is told once, on the package's own settings, which
# repository and which workflow file may publish it, and a job that is not this one
# gets nothing. What it costs is that the trust lives in a registry setting rather
# than in this file, so a renamed workflow file stops publishing until the setting
# is renamed with it.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Reading the code, and asking GitHub to vouch for this build. Provenance
      # fails without the second, and nothing else here needs any other write.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Authenticating a publish with the job's own identity needs a newer npm
      # than any runtime bundles, and it is pinned rather than taken as latest
      # because the tool that publishes is not a thing to let drift between one
      # version and the next.
      - run: npm install -g npm@12.0.2

      - run: npm ci

      # The library is held by everything that can hold it before a version of
      # it exists. The tests need nothing; the browser gates need a browser, and a
      # published version that has not been drawn with is a version nobody
      # checked; the packing gate needs an install, which is the only thing here
      # that reads what a consumer actually receives. The one gate that needs a
      # real graphics card cannot run on a runner at all, so a release is short of
      # that reading and says so here rather than pretending the set is complete.
      - run: npm test

      # The browser the dependency pins, rather than whatever the runner carries.
      - run: npx playwright install --with-deps chromium

      - run: npm run gate:browser

      # What a consumer gets, asked of an install rather than of these sources.
      # It packs this commit, installs the tarball outside the repository and asks
      # plain node to import it before asking a looser loader to build with it.
      # Every version published before this step existed could be loaded by a
      # bundler and by nothing else, and nothing in the set above could see that.
      - run: npm run gate:pack

      - name: Publish
        # --access public because the name is scoped, and a scoped package is
        # private by default, which would refuse the publish on a free account
        # rather than publish something nobody can install. --provenance is what
        # the id-token permission above is for, and it is also what signs in, so
        # nothing here reads a secret. The build happens in `prepack`, which every
        # path that makes a tarball runs, so what ships is compiled from the commit
        # being published rather than from whatever output happened to be lying
        # about. It used to be `prepublishOnly`, which publishing runs and packing
        # does not, and the gate above packed a tarball with no library in it.
        run: npm publish --provenance --access public
